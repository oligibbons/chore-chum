name: Notification Cron Job

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  # This allows you to manually trigger it from the GitHub Actions tab for testing
  workflow_dispatch: 

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Notification Route
        # Replace the URL below with your actual Vercel production URL
        run: |
          curl -X GET "https://chore-chum.vercel.app/api/cron/reminders" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"